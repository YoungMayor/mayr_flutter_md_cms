name: mayr_md_cms
description: >-
  A flexible Flutter widget that fetches and renders Markdown content from local
  assets, network URLs, or custom sources — with built-in loading and error handling.
version: 1.0.0
homepage: https://github.com/MayR-Labs/mayr_flutter_md_cms
repository: https://github.com/MayR-Labs/mayr_flutter_md_cms
issue_tracker: https://github.com/MayR-Labs/mayr_flutter_md_cms/issues
documentation: https://github.com/MayR-Labs/mayr_flutter_md_cms/wiki
license: MIT

environment:
  sdk: ^3.7.0
  flutter: ">=1.17.0"

dependencies:
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  faker: ^2.2.0
  mockito: ^5.4.6
  build_runner: ^2.4.15

flutter:
  assets:
    - assets/

topics:
  - cms
  - markdown
  - flutter
  - productivity
  - content
